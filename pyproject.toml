[project]
name = "apple-health-clinical-dashboard"
version = "0.1.0"
description = "Reproducible pipeline: Apple Health XML → clinical analysis → interactive HTML dashboard"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Lorenzo Berti", email = "berti.lorenzo.01@gmail.com" }]
keywords = ["health", "apple-watch", "clinical", "dashboard", "data-science"]

dependencies = [
    "lxml>=5.3",
    "pandas>=2.2",
    "numpy>=2.0",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "scipy>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "lxml-stubs>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/health_dashboard"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN", "B", "SIM"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/health_dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=health_dashboard --cov-report=term-missing"

[tool.coverage.run]
source = ["src/health_dashboard"]
